<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - Palm Island Community Company</title>
    <style>
        /* =========================================================
           PICC ANNUAL REPORT - PROFESSIONAL CSS TEMPLATE
           Using CSS Paged Media for print-quality output
           ========================================================= */

        /* CSS Variables - PICC Brand */
        :root {
            --ocean-blue: #4A7C9B;
            --deep-teal: #2D5A6B;
            --lavender: #9B7BB8;
            --soft-lilac: #C4A8D4;
            --sky-blue: #87CEEB;
            --sand-beige: #F5E6D3;
            --seafoam: #7FBBB3;
            --dark-text: #333333;
            --light-grey: #F0F7FA;
        }

        /* Page Setup */
        @page {
            size: A4;
            margin: 0;
        }

        @page content {
            margin: 15mm 15mm 70mm 15mm;

            @top-left {
                content: "PALM ISLAND COMMUNITY COMPANY";
                font-family: 'Helvetica Neue', Arial, sans-serif;
                font-size: 7pt;
                color: white;
                background: var(--ocean-blue);
                padding: 3mm 5mm;
            }

            @top-right {
                content: "ANNUAL REPORT {{ year }}";
                font-family: 'Helvetica Neue', Arial, sans-serif;
                font-size: 7pt;
                color: white;
                background: var(--ocean-blue);
                padding: 3mm 5mm;
            }

            @bottom-center {
                content: counter(page);
                font-family: 'Helvetica Neue', Arial, sans-serif;
                font-size: 9pt;
                font-weight: bold;
                color: white;
                background: var(--ocean-blue);
                border-radius: 50%;
                width: 8mm;
                height: 8mm;
                text-align: center;
                line-height: 8mm;
            }
        }

        @page cover {
            margin: 0;
        }

        @page back {
            margin: 0;
        }

        /* Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 10pt;
            line-height: 1.5;
            color: var(--dark-text);
        }

        /* Typography */
        h1 {
            font-size: 28pt;
            font-weight: 700;
            color: var(--ocean-blue);
            margin-bottom: 8mm;
            letter-spacing: -0.5pt;
        }

        h2 {
            font-size: 18pt;
            font-weight: 700;
            color: var(--ocean-blue);
            margin-bottom: 5mm;
            margin-top: 8mm;
        }

        h3 {
            font-size: 14pt;
            font-weight: 600;
            color: var(--lavender);
            margin-bottom: 4mm;
            margin-top: 6mm;
        }

        p {
            margin-bottom: 4mm;
            text-align: justify;
        }

        .intro {
            font-style: italic;
            color: var(--lavender);
            font-size: 11pt;
            line-height: 1.6;
            margin-bottom: 6mm;
        }

        .signature {
            font-size: 14pt;
            font-weight: 700;
            color: var(--ocean-blue);
            margin-top: 8mm;
        }

        /* Cover Page */
        .cover {
            page: cover;
            width: 210mm;
            height: 297mm;
            position: relative;
            overflow: hidden;
            page-break-after: always;
        }

        .cover-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg,
                var(--sky-blue) 0%,
                var(--sky-blue) 35%,
                #5DADE2 35%,
                #5DADE2 50%,
                var(--sand-beige) 50%,
                var(--sand-beige) 60%,
                var(--sky-blue) 60%
            );
        }

        .cover-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%);
            width: 170mm;
            height: 170mm;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .cover-logo {
            font-size: 16pt;
            font-weight: 700;
            color: var(--ocean-blue);
            margin-bottom: 2mm;
        }

        .cover-subtitle {
            font-size: 10pt;
            color: var(--ocean-blue);
            letter-spacing: 2pt;
            margin-bottom: 15mm;
        }

        .cover-year {
            font-size: 20pt;
            font-weight: 700;
            color: var(--ocean-blue);
            margin-bottom: 5mm;
        }

        .cover-title {
            font-size: 52pt;
            font-weight: 900;
            color: var(--dark-text);
            line-height: 1.1;
            text-align: center;
        }

        /* Wave Pattern SVG */
        .wave-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70mm;
        }

        /* Content Pages */
        .content-page {
            page: content;
            page-break-after: always;
            min-height: 200mm;
        }

        .content-page::after {
            content: "";
            display: block;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 210mm;
            height: 60mm;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300"><path fill="%23C4A8D4" d="M0,300 L0,150 Q250,100 500,150 T1000,150 L1000,300 Z"/><path fill="%232D5A6B" d="M0,300 L0,200 Q250,170 500,200 T1000,200 L1000,300 Z"/><circle fill="white" opacity="0.2" cx="100" cy="250" r="4"/><circle fill="white" opacity="0.2" cx="200" cy="240" r="3"/><circle fill="white" opacity="0.2" cx="300" cy="260" r="5"/><circle fill="white" opacity="0.2" cx="400" cy="245" r="3"/><circle fill="white" opacity="0.2" cx="500" cy="255" r="4"/><circle fill="white" opacity="0.2" cx="600" cy="235" r="3"/><circle fill="white" opacity="0.2" cx="700" cy="250" r="5"/><circle fill="white" opacity="0.2" cx="800" cy="242" r="4"/><circle fill="white" opacity="0.2" cx="900" cy="258" r="3"/><circle fill="white" opacity="0.15" cx="150" cy="220" r="3"/><circle fill="white" opacity="0.15" cx="350" cy="230" r="4"/><circle fill="white" opacity="0.15" cx="550" cy="215" r="3"/><circle fill="white" opacity="0.15" cx="750" cy="225" r="4"/><circle fill="white" opacity="0.15" cx="950" cy="235" r="3"/></svg>') no-repeat bottom;
            background-size: cover;
        }

        /* Portrait Photo Frames */
        .portrait-frame {
            width: 50mm;
            height: 50mm;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--ocean-blue);
            position: relative;
            margin: 0 auto 5mm;
        }

        .portrait-frame::before {
            content: "";
            position: absolute;
            top: -5mm;
            left: 50%;
            transform: translateX(-50%);
            width: 60mm;
            height: 30mm;
            border: 3px dotted white;
            border-bottom: none;
            border-radius: 30mm 30mm 0 0;
        }

        .portrait-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 5mm 0;
            font-size: 9pt;
        }

        thead th {
            background: var(--ocean-blue);
            color: white;
            padding: 3mm 4mm;
            text-align: left;
            font-weight: 600;
        }

        tbody tr:nth-child(even) {
            background: var(--light-grey);
        }

        tbody td {
            padding: 2.5mm 4mm;
            border-bottom: 0.5pt solid #e0e0e0;
        }

        .table-total {
            background: var(--deep-teal) !important;
            color: white;
            font-weight: 700;
        }

        .table-total td {
            border-bottom: none;
        }

        /* Two Column Layout */
        .two-col {
            display: flex;
            gap: 10mm;
        }

        .two-col > div {
            flex: 1;
        }

        /* Lists */
        ul {
            margin: 3mm 0 5mm 5mm;
        }

        ul li {
            margin-bottom: 2mm;
            padding-left: 2mm;
        }

        /* Highlight Box */
        .highlight-box {
            background: var(--soft-lilac);
            padding: 5mm;
            border-radius: 3mm;
            margin: 5mm 0;
        }

        .highlight-box h3 {
            color: var(--ocean-blue);
            margin-top: 0;
        }

        /* Acknowledgement Box */
        .acknowledgement {
            background: linear-gradient(135deg, var(--soft-lilac) 0%, var(--lavender) 100%);
            padding: 6mm;
            border-radius: 4mm;
            margin-top: 10mm;
        }

        .acknowledgement h3 {
            color: var(--ocean-blue);
            text-align: center;
            margin-top: 0;
        }

        .acknowledgement p {
            color: var(--dark-text);
            font-size: 9pt;
            text-align: center;
        }

        /* Charts Container */
        .chart-container {
            background: white;
            border: 1pt solid #e0e0e0;
            border-radius: 2mm;
            padding: 4mm;
            margin: 4mm 0;
        }

        /* Bar Chart (CSS-only) */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 3mm;
            height: 40mm;
            padding: 3mm;
        }

        .bar-group {
            display: flex;
            align-items: flex-end;
            gap: 1mm;
        }

        .bar {
            width: 8mm;
            background: var(--ocean-blue);
            border-radius: 1mm 1mm 0 0;
            position: relative;
        }

        .bar.year-1 { background: var(--ocean-blue); }
        .bar.year-2 { background: var(--lavender); }
        .bar.year-3 { background: var(--deep-teal); }

        .bar-label {
            position: absolute;
            top: -4mm;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7pt;
            font-weight: 600;
        }

        /* Financial Summary */
        .financial-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8mm;
        }

        /* Back Cover */
        .back-cover {
            page: back;
            width: 210mm;
            height: 297mm;
            position: relative;
            background: var(--sky-blue);
            page-break-before: always;
        }

        .back-circle {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 150mm;
            height: 150mm;
            background: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15mm;
            text-align: center;
        }

        .back-org-name {
            font-size: 22pt;
            font-weight: 700;
            color: var(--ocean-blue);
            margin-bottom: 8mm;
        }

        .back-contact {
            font-size: 10pt;
            color: var(--dark-text);
            line-height: 1.8;
        }

        .back-acn {
            font-size: 10pt;
            font-weight: 700;
            color: var(--ocean-blue);
            margin-top: 5mm;
        }

        .back-statement {
            position: absolute;
            bottom: 35mm;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 9pt;
            padding: 0 20mm;
        }

        /* Pie Chart Legend */
        .pie-legend {
            display: flex;
            flex-direction: column;
            gap: 2mm;
            font-size: 8pt;
        }

        .pie-legend-item {
            display: flex;
            align-items: center;
            gap: 2mm;
        }

        .pie-legend-color {
            width: 4mm;
            height: 4mm;
            border-radius: 1mm;
        }

        /* Utility */
        .text-center { text-align: center; }
        .text-white { color: white; }
        .mb-4 { margin-bottom: 4mm; }
        .mt-4 { margin-top: 4mm; }

    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
